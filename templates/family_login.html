{% extends "base.html" %}
{% block title %}دخول الأسرة — زاد الوفا{% endblock %}
{% block content %}
<section class="panel narrow">
  <h2>اختاري ملفك (دخول تجريبي)</h2>
  <p class="muted">بدون كلمة مرور — نموذج أولي لتجربة لوحة الأسرة.</p>
  <div class="family-select-list">
    {% for f in families %}
    <a class="family-select-item" href="{{ url_for('family_login_as', family_id=f.id) }}">
      <b>{{ f.name }}</b>
      <span class="muted">{{ f.area }}</span>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
